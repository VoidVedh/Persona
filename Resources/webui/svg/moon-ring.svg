<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer 24 tick marks at r=96..100 -->
  <g stroke="#00d8ff" stroke-opacity="0.75" stroke-width="1.8">
    <line x1="100" y1="0" x2="100" y2="10" stroke-width="2.5" stroke="#ffffff"/>
    <line x1="100" y1="190" x2="100" y2="200" stroke-width="2.5" stroke="#ffffff"/>
    <line x1="0" y1="100" x2="10" y2="100" stroke-width="2.5" stroke="#ffffff"/>
    <line x1="190" y1="100" x2="200" y2="100" stroke-width="2.5" stroke="#ffffff"/>
  </g>
  <!-- 12-segment notched revolver cylinder ring: 2*pi*88 = 552.92 = 12*(38.07 + 8) -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#00d8ff" stroke-width="10" stroke-dasharray="38.07 8"/>
  <!-- Inner thin ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#5ce5ff" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="14 6"/>
  <!-- 6 revolver chambers at radius 48 (angles 0, 60, 120, 180, 240, 300) -->
  <g fill="#050c1a" fill-opacity="0.7" stroke="#00d8ff" stroke-width="2">
    <circle cx="148" cy="100" r="12"/>
    <circle cx="124" cy="141.57" r="12"/>
    <circle cx="76" cy="141.57" r="12"/>
    <circle cx="52" cy="100" r="12"/>
    <circle cx="76" cy="58.43" r="12"/>
    <circle cx="124" cy="58.43" r="12"/>
  </g>
</svg>
