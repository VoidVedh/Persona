<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 580" fill="none">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#5ce5ff"/>
      <stop offset="100%" stop-color="#0051ff"/>
    </linearGradient>
    <linearGradient id="silGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
  </defs>

  <!-- Concentric astral clock / revolver rings -->
  <g transform="translate(215, 220)">
    <circle r="138" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="28 10"/>
    <circle r="112" stroke="#050c1a" stroke-width="6" stroke-dasharray="44 14"/>
    <circle r="86" stroke="#ffffff" stroke-width="2.5"/>
    <!-- 6 revolver chambers -->
    <circle cx="0" cy="-58" r="13" fill="#050c1a" stroke="#00d8ff" stroke-width="3"/>
    <circle cx="50" cy="-29" r="13" fill="#050c1a" stroke="#00d8ff" stroke-width="3"/>
    <circle cx="50" cy="29" r="13" fill="#050c1a" stroke="#00d8ff" stroke-width="3"/>
    <circle cx="0" cy="58" r="13" fill="#050c1a" stroke="#00d8ff" stroke-width="3"/>
    <circle cx="-50" cy="29" r="13" fill="#050c1a" stroke="#00d8ff" stroke-width="3"/>
    <circle cx="-50" cy="-29" r="13" fill="#050c1a" stroke="#00d8ff" stroke-width="3"/>
    <!-- Crescent moon cutout -->
    <path d="M -12,-38 A 40,40 0 1,0 -12,38 A 30,34 0 1,1 -12,-38 Z" fill="#ffffff"/>
  </g>

  <!-- Stylized anime-inspired vanguard silhouette & diagonal blade -->
  <polygon points="75,580 125,330 175,285 225,295 268,350 315,580" fill="url(#silGrad)" stroke="#00d8ff" stroke-width="3"/>
  <!-- High-collar jacket + armband accent -->
  <polygon points="145,330 198,295 245,335 225,420 155,405" fill="#050c1a" stroke="#ffffff" stroke-width="2.5"/>
  <polygon points="112,410 168,395 162,428 106,442" fill="#ff3b5c"/>
  <polygon points="116,416 164,403 161,416 113,429" fill="#ffffff"/>

  <!-- Angular profile visor / hair spikes silhouette -->
  <polygon points="155,288 142,235 170,242 182,198 205,228 238,195 232,244 262,238 238,278 212,298" fill="#050c1a" stroke="#ffffff" stroke-width="3"/>
  <!-- Glowing cyan eye slash -->
  <polygon points="184,258 228,244 218,262 178,268" fill="#00d8ff"/>
  <polygon points="190,256 222,247 215,257 186,262" fill="#ffffff"/>

  <!-- Diagonal Evoker / energy blade slash across foreground -->
  <polygon points="35,495 345,115 362,130 62,518" fill="url(#bladeGrad)"/>
  <polygon points="28,505 338,125 344,132 34,512" fill="#ffffff"/>
</svg>

