<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Persona Mode — Desktop HUD</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shapes.css">
  <link rel="stylesheet" href="css/hud.css">
</head>
<body data-surface="hud" data-fixture="hud.afterschool" data-autoboot="1">
  <div id="hud-root">
    <!-- LAYER 0..8: Layered P3R Wallpaper Stage (§6.6) -->
    <div id="wp-stage" class="wp-stage" data-mode="overlay">
      <!-- L0: Base Gradient -->
      <div class="wp-l0"></div>

      <!-- L1: 6 Ocean Wave Sine Paths -->
      <svg class="wp-l1" viewBox="0 0 1600 500" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,180 C320,120 640,240 960,160 C1240,90 1440,210 1600,150 L1600,500 L0,500 Z" fill="var(--cyan)" fill-opacity="0.08"/>
        <path d="M0,230 C280,290 620,150 940,230 C1220,300 1420,180 1600,220 L1600,500 L0,500 Z" fill="var(--cyan)" fill-opacity="0.11"/>
        <path d="M0,280 C360,210 700,330 1040,260 C1300,200 1480,290 1600,250 L1600,500 L0,500 Z" fill="var(--cyan)" fill-opacity="0.14" stroke="var(--cyan-hi)" stroke-opacity="0.35" stroke-width="2"/>
        <path d="M0,330 C300,380 660,260 1000,340 C1280,390 1460,310 1600,340 L1600,500 L0,500 Z" fill="var(--cyan)" fill-opacity="0.16"/>
        <path d="M0,380 C380,330 740,420 1100,370 C1340,330 1500,400 1600,375 L1600,500 L0,500 Z" fill="var(--azure)" fill-opacity="0.22" stroke="var(--white)" stroke-opacity="0.28" stroke-width="1.5"/>
        <path d="M0,430 C340,460 720,390 1080,435 C1320,465 1490,415 1600,435 L1600,500 L0,500 Z" fill="var(--ink)" fill-opacity="0.65"/>
      </svg>

      <!-- L2: Giant Moon + Original Angular Spire Silhouette -->
      <div class="wp-l2">
        <div class="wp-moon-disc"></div>
        <svg class="wp-spire-svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
          <!-- Stacked angular Tartarus-inspired geometric monoliths -->
          <polygon points="180,800 235,360 365,360 420,800" fill="#050c1a" stroke="var(--cyan)" stroke-opacity="0.38" stroke-width="2"/>
          <polygon points="215,520 255,210 345,210 385,520" fill="#050c1a" stroke="var(--cyan)" stroke-opacity="0.48" stroke-width="2"/>
          <polygon points="258,280 286,70 314,70 342,280" fill="#050c1a" stroke="var(--white)" stroke-opacity="0.55" stroke-width="2"/>
          <polygon points="292,90 300,12 308,90" fill="var(--cyan)"/>
          <!-- Angular buttresses & crossbars -->
          <polygon points="140,800 210,560 245,560 195,800" fill="#0a192f" stroke="var(--cyan)" stroke-opacity="0.3" stroke-width="1.5"/>
          <polygon points="460,800 390,560 355,560 405,800" fill="#0a192f" stroke="var(--cyan)" stroke-opacity="0.3" stroke-width="1.5"/>
          <rect x="220" y="340" width="160" height="8" fill="var(--cyan)" fill-opacity="0.75"/>
          <rect x="246" y="200" width="108" height="6" fill="var(--white)" fill-opacity="0.8"/>
        </svg>
      </div>

      <!-- L3: 4 Diagonal Slashes -->
      <div class="wp-l3">
        <div class="wp-slash wp-slash--4"></div>
        <div class="wp-slash wp-slash--3"></div>
        <div class="wp-slash wp-slash--2"></div>
        <div class="wp-slash wp-slash--1"></div>
        <div class="wp-slash wp-slash--1-edge"></div>
      </div>

      <!-- L4: Halftone Matrix -->
      <div class="wp-l4"></div>

      <!-- L5: Giant Outline Typography + Tactical Labels -->
      <div class="wp-l5">
        <div class="wp-outline-word wp-outline-word--top">MEMENTO MORI</div>
        <div class="wp-outline-word wp-outline-word--bottom">DARK HOUR</div>
        <div class="wp-tech-tag wp-tech-tag--tl">PORT ISLAND // SECTOR 04 · 34.6697° N, 135.2145° E</div>
        <div class="wp-tech-tag wp-tech-tag--br">TARTARUS // 0:00 · S.E.E.S. FIELD OVERLAY</div>
      </div>

      <!-- L6: Ambient Rising Bubbles Canvas -->
      <canvas id="wp-bubbles-canvas" class="wp-l6-canvas" width="1512" height="982"></canvas>

      <!-- L7: Rotating HUD Rings Centered on Moon -->
      <div class="wp-l7">
        <div class="wp-ring wp-ring--outer"></div>
        <div class="wp-ring wp-ring--inner"></div>
      </div>

      <!-- L8: Vignette -->
      <div class="wp-l8"></div>
    </div>

    <!-- TOP-RIGHT DATE / TIME-OF-DAY / MOON HUD (§6.4, y >= 66px so top 50px is clear) -->
    <div class="hud-topright">
      <!-- D. Moon Phase Widget -->
      <div class="moon-widget">
        <div class="moon-ring-box">
          <svg class="moon-svg" viewBox="0 0 200 200" aria-hidden="true">
            <!-- 24 outer tick marks at r=96..102 -->
            <g stroke="var(--cyan)" stroke-opacity="0.78" stroke-width="2">
              <line x1="100" y1="0" x2="100" y2="10" stroke="var(--white)" stroke-width="3"/>
              <line x1="125.88" y1="3.41" x2="124.33" y2="9.2" />
              <line x1="150" y1="13.4" x2="147" y2="18.6" />
              <line x1="170.71" y1="29.29" x2="166.47" y2="33.53" />
              <line x1="186.6" y1="50" x2="181.4" y2="53" />
              <line x1="196.59" y1="74.12" x2="190.8" y2="75.67" />
              <line x1="200" y1="100" x2="190" y2="100" stroke="var(--white)" stroke-width="3"/>
              <line x1="196.59" y1="125.88" x2="190.8" y2="124.33" />
              <line x1="186.6" y1="150" x2="181.4" y2="147" />
              <line x1="170.71" y1="170.71" x2="166.47" y2="166.47" />
              <line x1="150" y1="186.6" x2="147" y2="181.4" />
              <line x1="125.88" y1="196.59" x2="124.33" y2="190.8" />
              <line x1="100" y1="200" x2="100" y2="190" stroke="var(--white)" stroke-width="3"/>
              <line x1="74.12" y1="196.59" x2="75.67" y2="190.8" />
              <line x1="50" y1="186.6" x2="53" y2="181.4" />
              <line x1="29.29" y1="170.71" x2="33.53" y2="166.47" />
              <line x1="13.4" y1="150" x2="18.6" y2="147" />
              <line x1="3.41" y1="125.88" x2="9.2" y2="124.33" />
              <line x1="0" y1="100" x2="10" y2="100" stroke="var(--white)" stroke-width="3"/>
              <line x1="3.41" y1="74.12" x2="9.2" y2="75.67" />
              <line x1="13.4" y1="50" x2="18.6" y2="53" />
              <line x1="29.29" y1="29.29" x2="33.53" y2="33.53" />
              <line x1="50" y1="13.4" x2="53" y2="18.6" />
              <line x1="74.12" y1="3.41" x2="75.67" y2="9.2" />
            </g>

            <!-- Rotating 12-segment notched revolver cylinder ring + 6 chambers -->
            <g class="moon-svg__cylinder">
              <circle cx="100" cy="100" r="88" fill="none" stroke="var(--cyan)" stroke-width="10" stroke-dasharray="38.07 8"/>
              <g fill="var(--ink)" fill-opacity="0.78" stroke="var(--cyan)" stroke-width="2">
                <circle cx="148" cy="100" r="12"/>
                <circle cx="124" cy="141.57" r="12"/>
                <circle cx="76" cy="141.57" r="12"/>
                <circle cx="52" cy="100" r="12"/>
                <circle cx="76" cy="58.43" r="12"/>
                <circle cx="124" cy="58.43" r="12"/>
              </g>
            </g>

            <!-- Counter-rotating inner thin ring -->
            <circle class="moon-svg__inner" cx="100" cy="100" r="70" fill="none" stroke="var(--cyan)" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="14 6"/>

            <!-- Center moon disc (r=32) -->
            <circle cx="100" cy="100" r="32" fill="var(--midnight)" stroke="var(--ice)" stroke-width="2"/>
            <path id="moon-lit-path" class="moon-svg__lit" d="" fill="#e8f6ff"/>
          </svg>
        </div>

        <!-- NEXT FULL MOON Countdown Chip -->
        <div class="plate moon-chip">
          <i class="plate__back s-para" style="--sk:8px"></i>
          <i class="plate__mid s-para" style="--sk:8px"></i>
          <span class="plate__face s-para" style="--sk:8px">
            <span class="moon-chip__sub">NEXT FULL MOON</span>
            <span id="moon-countdown" class="moon-chip__val">T-08D 12H</span>
          </span>
        </div>
      </div>

      <!-- A + B + C. Giant Numerals, THU Badge, and AFTER SCHOOL Banner -->
      <div class="date-cluster">
        <div class="date-numerals">
          <span id="date-month" class="p3-outline date-month" data-text="11">11</span>
          <span class="date-slash">/</span>
          <span id="date-day" class="p3-outline date-day" data-text="05">05</span>
        </div>

        <!-- B. Day-of-week badge -->
        <div class="plate dow-badge">
          <i class="plate__back s-para" style="--sk:10px"></i>
          <i class="plate__mid s-para" style="--sk:10px"></i>
          <span id="dow-label" class="plate__face s-para" style="--sk:10px">THU</span>
        </div>

        <!-- C. Time-of-day slot banner -->
        <div class="plate slot-banner">
          <i class="plate__back s-tab-right" style="--c:22px"></i>
          <i class="plate__mid s-tab-right" style="--c:22px"></i>
          <span class="plate__face s-tab-right" style="--c:22px">
            <span class="slot-banner__arrow">▸</span>
            <span id="slot-label" class="slot-banner__label">AFTER SCHOOL</span>
          </span>
        </div>
      </div>
    </div>

    <!-- BOTTOM-LEFT NOW-PLAYING WIDGET (§6.5) -->
    <div id="hud-nowplaying" class="hud-nowplaying" data-state="playing">
      <div class="plate plate--lg np-frame">
        <i class="plate__back s-jag"></i>
        <i class="plate__mid s-jag"></i>
        <div class="plate__face s-jag">
          <div class="np-inner-rim s-jag"></div>
          <div class="np-halftone-sweep"></div>

          <!-- Left Vinyl + Wings -->
          <div class="np-disc-stage">
            <img class="np-wings" src="svg/wings.svg" alt="">
            <img class="np-vinyl" src="svg/vinyl.svg" alt="">
          </div>

          <!-- Right Track Info + 28-Bar Synthetic Equalizer -->
          <div class="np-body">
            <div class="np-kicker">NOW PLAYING // S.E.E.S. AUDIO</div>
            <div id="np-title" class="np-title">COLOR YOUR NIGHT</div>
            <div class="plate np-artist-chip">
              <i class="plate__back s-para" style="--sk:8px"></i>
              <span id="np-artist" class="plate__face s-para" style="--sk:8px">ATLUS SOUND TEAM</span>
            </div>
            <canvas id="np-eq-canvas" class="np-eq-canvas" width="568" height="100" data-source="synthetic"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/fixtures.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/moon.js"></script>
  <script src="js/eq.js"></script>
  <script src="js/bubbles.js"></script>
  <script src="js/hud.js"></script>
</body>
</html>
